name: Build Typst PDF

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clona la repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Compila il file Typst in PDF
      - name: Build PDF with Typst
        uses: lvignoli/typst-action@main
        with:
          source_file: cheatsheet.typ
          options: "--font-path=./fonts"

      # 3️⃣ Sposta il PDF nella cartella desiderata
      - name: Move PDF to analysis folder
        run: |
          mkdir -p 1st_semester/analisi1
          mv cheatsheet.pdf 1st_semester/analisi1/cheatsheet.pdf

      # 4️⃣ Carica il PDF come artefatto
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: 1st_semester/analisi1/cheatsheet.pdf

      # 5️⃣ Ottieni la data corrente
      - name: Get current date
        id: date
        run: echo "DATE=$(date +%Y-%m-%d-%H:%M)" >> $GITHUB_ENV

      # 6️⃣ Carica il PDF in una release
      - name: Upload PDF to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 1st_semester/analisi1/cheatsheet.pdf
          asset_name: cheatsheet.pdf
          tag: latest-pdf
          overwrite: true
          body: "Aggiornamento PDF"
          release_name: "PDF ${{ env.DATE }}"
