name: Build Typst PDF
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build PDF with Typst
        uses: lvignoli/typst-action@main
        with:
          source_file: 1st_semester/analisi1/cheatsheet.typ
          options: "--font-path=./fonts"

      - name: Show build output (debug)
        run: |
          echo "=== repo tree ==="
          ls -la
          echo "=== target dir ==="
          ls -la 1st_semester/analisi1 || true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: 1st_semester/analisi1/cheatsheet.pdf

      - name: Get current date
        id: date
        run: echo "DATE=$(date +%Y-%m-%d-%H:%M)" >> $GITHUB_ENV

      # Create a release (so upload-release-action has a release to attach to)
      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: pdf-${{ github.sha }}
          release_name: "PDF ${{ env.DATE }}"
          body: "PDF update"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PDF to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 1st_semester/analisi1/cheatsheet.pdf
          asset_name: cheatsheet.pdf
          overwrite: true